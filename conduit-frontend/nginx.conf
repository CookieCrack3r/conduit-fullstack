server {
    listen 8282;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular is a single-page application: every unknown path must fall back to
    # index.html so that client-side routing (and page reloads on deep links)
    # keep working instead of returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build artefacts are immutable and safe to cache aggressively.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, otherwise clients keep loading an old
    # bundle after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
